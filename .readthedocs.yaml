# Read the Docs builds the same MkDocs site that GitHub Pages gets from mike.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    # uv brings the Python version the project needs and installs the locked docs group.
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    - uv run --only-group docs mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html
