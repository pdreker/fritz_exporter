[project]
name = "fritz-exporter"
version = "4.0.1"
description = "Prometheus exporter for AVM Fritz! Devices"
authors = [{name = "Patrick Dreker", email = "patrick@dreker.de"}]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/pdreker/fritz_exporter"
repository = "https://github.com/pdreker/fritz_exporter"
documentation = "https://fritz-exporter.readthedocs.io"
keywords = ["prometheus", "fritz", "router", "grafana"]
classifiers = [
    "Development Status :: 6 - Mature",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.14"
dependencies = [
    "prometheus-client>=0.6.0",
    "fritzconnection>=1.0.0",
    "pyyaml",
    "requests",
    "attrs>=22.2,<27.0",
    "defusedxml>=0.7.1,<0.8",
]

[project.urls]
Homepage = "https://github.com/pdreker/fritz_exporter"
Repository = "https://github.com/pdreker/fritz_exporter"
Documentation = "https://fritz-exporter.readthedocs.io"

[project.scripts]
fritzexporter = "fritzexporter.__main__:main"

[dependency-groups]
dev = [{include-group = "lint"}, {include-group = "test"}]
docs = [
    "mike>=2.2.0",
    "mkdocs-material>=9.8.0",
]
lint = ["ruff>=0.1.7", "ty"]
test = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "coverage",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Cooling-off: resolve only releases that are at least a week old.
# Renovate cannot check lock file maintenance, so uv enforces the week.
exclude-newer = "1 week"

[tool.hatch.build.targets.wheel]
packages = ["fritzexporter"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov-branch --cov=fritzexporter --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

# Shared starting point: pdreker/github-workflows, templates/pyproject-tools.toml.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", # pycodestyle
  "F",      # Pyflakes
  "C90",    # McCabe (function complexity)
  "I",      # isort
  "N",      # PEP 8 naming
  "UP",     # pyupgrade
  "YTT",    # flake8-2020
  "ANN",    # flake8-annotations
  "ASYNC",  # flake8-async
  "S",      # flake8-bandit
  "BLE",    # blind except
  "FBT",    # boolean traps
  "B",      # bugbear
  "A",      # flake8-builtins
  "COM",    # flake8-commas
  "C4",     # flake8-comprehensions
  "DTZ",    # naive datetime objects
  "T10",    # debugger imports
  "EM",     # error message formatting
  "FA",     # future annotations
  "ISC",    # implicit string concatenation
  "G",      # logging format
  "INP",    # implicit namespace packages
  "PIE",    # various anti-patterns
  "T20",    # print() calls
  "PT",     # pytest style
  "Q",      # quotes
  "RSE",    # raise syntax
  "RET",    # return values
  "SLF",    # private member access
  "SLOT",   # __slots__
  "SIM",    # simplify
  "INT",    # gettext
  "ARG",    # unused arguments
  "PTH",    # pathlib
  "TD",     # TODO comments
  "FIX",    # FIXME/XXX
  "PGH",    # pygrep-hooks
  "PL",     # Pylint
  "TRY",    # try/except anti-patterns
  "FLY",    # join vs f-strings
  "PERF",   # performance
  "FURB",   # refurb (modernize)
  "LOG",    # logging
  "RUF",    # ruff's own rules
]
ignore = [
  "E203",   # whitespace before ':', conflicts with the formatter
  "COM812", # trailing comma, conflicts with the formatter
  "ISC001", # implicit string concatenation, conflicts with the formatter
  "ANN204", # return type of __init__ and other special methods
  "TRY003", # long messages in exception calls; a domain error's message is its content
  "RUF001", # ambiguous characters: ×, –, ℮, › and the like are written on purpose
  "RUF002", # same, in docstrings
  "RUF003", # same, in comments
]

[tool.ruff.lint.per-file-ignores]
# Tests are linted like the rest; only rules that make no sense there are off.
"tests/**" = [
  "S101",    # assert is how pytest checks
  "PLR2004", # expected values are literals
  "INP001",  # tests/ needs no __init__.py
  "SLF001",  # tests may check private members
  "ARG001",  # pytest fixtures requested only for their effect
  "ARG002",  # same, in test methods
  "ANN401",  # Any is fine for mocks and fakes
  "S104",    # tests check the documented bind-all default
  "S105",    # made-up credentials
  "S106",    # same, as arguments
]
# Deviation: stand-alone scripts, not part of a package.
"misc/**" = ["INP001"]

[tool.ruff.lint.pylint]
# Pylint's default of 5 flagged UI builders, drawing helpers and filter functions in every
# SportShooters repository; up to 8 still reads.
max-args = 8

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

