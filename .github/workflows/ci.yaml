name: CI

# Shared workflow: pdreker/github-workflows.

on:
  # Every pull request, whatever it targets; push only on main, since a branch push is
  # already covered by its pull request.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: pdreker/github-workflows/.github/workflows/python-ci.yaml@dcdd01b1d81eb4b072737706a7adc403cad4c2a4 # v1.3.1
    with:
      extra-run: uv run mkdocs build --strict
      # Full history for SonarQube Cloud (blame data).
      fetch-depth: 0
      sonar: true
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
