name: PR Title

# We squash-merge, so the PR title becomes the commit on main that release-please
# reads.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    uses: pdreker/github-workflows/.github/workflows/pr-title.yaml@86c4e71ad830e8a10c9819193ec8b9720b4bd57b # v1.1.0
