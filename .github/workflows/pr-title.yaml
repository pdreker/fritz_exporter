name: PR Title

# We squash-merge, so the PR title becomes the commit on main that release-please
# reads.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    uses: pdreker/github-workflows/.github/workflows/pr-title.yaml@112f894856e31b36acf99cc2df639234650e64e5 # v1.2.0
