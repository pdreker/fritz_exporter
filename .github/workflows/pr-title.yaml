name: PR Title

# We squash-merge, so the PR title becomes the commit on main that release-please
# reads.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    uses: pdreker/github-workflows/.github/workflows/pr-title.yaml@dcdd01b1d81eb4b072737706a7adc403cad4c2a4 # v1.3.1
