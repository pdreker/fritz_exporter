name: PR Title

# We squash-merge, so the PR title becomes the commit on main that release-please
# reads.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    uses: pdreker/github-workflows/.github/workflows/pr-title.yaml@12d47f35046c4ad91c75570b4e9920acb1c34de0 # v1.4.0
