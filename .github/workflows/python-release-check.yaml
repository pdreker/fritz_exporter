name: Check for new stable Python release

# Renovate only proposes patch updates of the python base image (renovate.json);
# minor and major interpreter bumps are done by hand. This job gives the heads-up
# for a new *stable* minor/major release by opening a tracking issue.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check Python release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for newer stable Python
        run: python3 .github/scripts/check_python_release.py
        env:
          GH_TOKEN: ${{ github.token }}
