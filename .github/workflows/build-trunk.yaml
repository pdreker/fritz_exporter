name: Build Trunk

# Every push to main publishes a rolling :develop image (amd64 and arm64 only: the
# emulated 32-bit ARM builds are slow, and release images cover them).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    uses: pdreker/github-workflows/.github/workflows/docker-image.yaml@dcdd01b1d81eb4b072737706a7adc403cad4c2a4 # v1.3.1
    with:
      registry: ${{ vars.DOCKER_REGISTRY_HOST }}
      registry-username: ${{ vars.DOCKER_REGISTRY_USERNAME }}
      image: ${{ vars.DOCKER_REGISTRY_HOST }}/${{ vars.DOCKER_REGISTRY_REPO }}/${{ vars.DOCKER_REGISTRY_IMAGE }}
    secrets:
      registry-password: ${{ secrets.DOCKER_HUB }}
