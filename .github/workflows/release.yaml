name: release-please

# release-please maintains a release PR; merging it creates release and tag in the
# same run, which then publishes the versioned artifacts. The checks on the release
# PR wait for approval ("Approve workflows to run") because it is opened with
# GITHUB_TOKEN.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: pdreker/github-workflows/.github/workflows/release-please.yaml@112f894856e31b36acf99cc2df639234650e64e5 # v1.2.0

  image:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: pdreker/github-workflows/.github/workflows/docker-image.yaml@112f894856e31b36acf99cc2df639234650e64e5 # v1.2.0
    with:
      registry: ${{ vars.DOCKER_REGISTRY_HOST }}
      registry-username: ${{ vars.DOCKER_REGISTRY_USERNAME }}
      image: ${{ vars.DOCKER_REGISTRY_HOST }}/${{ vars.DOCKER_REGISTRY_REPO }}/${{ vars.DOCKER_REGISTRY_IMAGE }}
      platforms: linux/arm/v6,linux/arm/v7,linux/amd64,linux/arm64
      version: ${{ needs.release.outputs.version }}
    secrets:
      registry-password: ${{ secrets.DOCKER_HUB }}

  pypi:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    name: Build & publish to PyPI
    # Trusted Publishing: PyPI accepts an OIDC token issued for this repository, this
    # workflow file and this environment instead of a stored API token.
    environment:
      name: pypi
      url: https://pypi.org/project/fritz-exporter/
    permissions:
      contents: read
      id-token: write # to request the OIDC token PyPI exchanges for an upload token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6" # exact: Renovate bumps it, with the seven-day wait
          python-version: "3.14"
      - name: Build and publish
        # "always": fail if the token exchange does not work, rather than falling back.
        run: uv build && uv publish --trusted-publishing always

  publish-docs-release:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      # mike pushes to gh-pages with the credentials the checkout keeps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6" # exact: Renovate bumps it, with the seven-day wait
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --only-group docs
      - name: Publish
        env:
          VERSION: ${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          uv run --only-group docs mike deploy --push --allow-empty --update-aliases "$VERSION" latest
          uv run --only-group docs mike set-default --push latest
