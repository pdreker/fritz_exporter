{{- if .Values.createConfigSecret }}
{{- if not .Values.config }}
{{- fail "missing config in values.yaml." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fritz-exporter.fullname" . }}-config
  labels:
    {{- include "fritz-exporter.labels" . | nindent 4 }}
data:
  {{- /* In a pod the exporter must listen on the pod's address; the config's own
  listen_address wins. */}}
  config.yaml: {{ merge (deepCopy .Values.config) (dict "listen_address" "0.0.0.0") | toYaml | b64enc }}
{{- end }}
